; Réglages production — ne s'applique qu'à l'image Docker (docker/Dockerfile).
; Le reste (memory_limit par défaut, etc.) vient de la config PHP de base.

expose_php = Off
date.timezone = UTC

; Alignés sur la limite d'upload d'image de StoreRoomRequest (5 Mo/fichier,
; jusqu'à plusieurs fichiers par requête) + marge pour les pièces d'identité.
upload_max_filesize = 10M
post_max_size = 15M
max_file_uploads = 10

memory_limit = 256M
max_execution_time = 60

; OPcache — bytecode compilé une fois au build, jamais revalidé sur disque :
; un déploiement = une nouvelle image, donc pas besoin de checker les mtimes
; à chaque requête (gain de perf notable). Redémarrer les conteneurs après
; chaque déploiement pour invalider le cache (voir deploy/README.md).
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
