name: CI

on:
  push:
    branches: [main, Dev, Test]
  pull_request:

# Moindre privilège, pour les trois jobs : ils clonent le dépôt et exécutent
# des commandes, rien de plus — aucune écriture, aucun commentaire de PR,
# aucun paquet publié.
#
# Déclarer les droits ici plutôt que de s'en remettre au réglage du dépôt :
# celui-ci vaut « read » aujourd'hui, mais un passage en « read and write »
# élargirait sinon les trois jobs d'un coup, sans que rien ne le signale.
permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        # Épinglée sur le commit plutôt que sur le tag mutable v2 : une action
        # tierce dont le tag est réassigné exécuterait du code arbitraire dans
        # la CI sans qu'aucun fichier de ce dépôt ne change. Les actions/* sont
        # publiées par GitHub et bénéficient de tags immuables, d'où l'écart
        # de traitement.
        # eb7c497 = v2.40.0 — à rafraîchir en même temps que la version.
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, gd, bcmath, intl, fileinfo
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests (SQLite in-memory)
        run: php artisan test

      - name: Dependency vulnerability scan
        # Bloquant : composer audit est propre (laravel/framework, commonmark,
        # flysystem et phpseclib montés le 2026-10-07 pour cinq advisories
        # publiées fin septembre — voir l'historique git). Si une nouvelle CVE
        # transitive apparaît sans correctif publié, repasser temporairement en
        # continue-on-error plutôt que d'ignorer le job.
        run: composer audit --no-interaction

  frontend-build:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prepare environment
        # Le build embarque les variables VITE_* (dont VITE_APP_NAME, le nom de
        # l'établissement). On part du .env.example versionné, comme en prod.
        run: cp .env.example .env

      - name: Build
        run: npm run build

      - name: Dependency vulnerability scan
        # Bloquant depuis le 2026-10-11, comme composer audit côté backend.
        # Les montées majeures qui le retenaient sont faites (vite 5→8,
        # vitest 2→5, tailwindcss 3→4, react-router-dom 6→7) : npm audit est
        # revenu à zéro vulnérabilité, il n'y a plus de raison de tolérer.
        # Si une CVE transitive apparaît sans correctif publié, repasser
        # temporairement en continue-on-error plutôt que d'ignorer le job.
        run: npm audit --audit-level=high

  secret-scan:
    name: Secrets (fichiers versionnés)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan des fichiers suivis par git
        # Les .env réels sont gitignorés ; la fuite publique du dépôt est venue
        # des .env.example, faits pour être commités et dans lesquels de vraies
        # clés avaient remplacé les placeholders. Ce job ferme ce trou.
        run: bash scripts/check-secrets.sh
