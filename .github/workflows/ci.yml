name: CI

on:
  push:
    branches: [main, Dev, Test]
  pull_request:

jobs:
  backend-tests:
    name: Backend (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, gd, bcmath, intl, fileinfo
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests (SQLite in-memory)
        run: php artisan test

      - name: Dependency vulnerability scan
        # Bloquant : composer audit est propre (league/commonmark, dompdf,
        # guzzle mis à jour le 2026-08-25 — voir l'historique git). Si une
        # nouvelle CVE transitive apparaît sans fix disponible, repasser
        # temporairement en continue-on-error plutôt que d'ignorer le job.
        run: composer audit --no-interaction

  frontend-build:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prepare environment
        # Le build embarque les variables VITE_* (dont VITE_APP_NAME, le nom de
        # l'établissement). On part du .env.example versionné, comme en prod.
        run: cp .env.example .env

      - name: Build
        run: npm run build

      - name: Dependency vulnerability scan
        # Non bloquant : le socket.io-client mort (via laravel-echo) est réglé
        # (nanoid/postcss/ws/socket.io-parser/engine.io-client/undici/axios
        # patchés le 2026-08-25 — voir l'historique git), mais il reste deux
        # advisories high/critical réelles qui exigent un bump majeur cassant
        # (vite 5→8, react-router-dom 6→7) : non applicables sans campagne de
        # tests dédiée. Repassera bloquant une fois ces deux migrations faites.
        run: npm audit --audit-level=high
        continue-on-error: true
