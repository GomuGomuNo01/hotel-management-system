name: Deploy Présentation → GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "assets/video/**"
      - "!assets/video/source/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:   # déclenchement manuel possible

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        # enablement: true — l'action active Pages elle-même si le dépôt n'a
        # pas encore de site. Sans cela, elle reçoit un 404 de l'API Pages et
        # échoue en quelques secondes, avant même d'assembler le site : c'est
        # ce qui bloquait le déploiement tant que Pages n'était pas activé à la
        # main dans les réglages.
        #
        # À savoir : sur un fork, le premier run active donc Pages et publie le
        # site sans intervention. Pour l'éviter, repasser à false — le dépôt
        # devra alors avoir Pages activé au préalable (Settings → Pages →
        # Source : GitHub Actions).
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Assemble site (page de présentation)
        run: |
          mkdir -p _site/presentation
          cp assets/video/index.html assets/video/LaBaieDesLacs_presentation.mp4 assets/video/presentation-poster.jpg _site/presentation/
          printf '%s\n' '<!doctype html>' '<html lang="fr"><head><meta charset="utf-8">' '<title>La baie des lacs</title>' '<meta http-equiv="refresh" content="0; url=./presentation/"></head>' '<body style="background:#F6F0E5;color:#16241E;font-family:system-ui,sans-serif;padding:40px">' '<p><a href="./presentation/" style="color:#1F7A46">Voir la présentation vidéo du projet</a></p>' '</body></html>' > _site/index.html

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
