<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Hospy">
  <!--
    Monogramme Hospy — géométrie volontairement massive (barres de 4.5/32)
    pour rester lisible à 16 px, où le dégradé se lit comme un aplat vert.
  -->
  <defs>
    <linearGradient id="hospyMark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2F9E5B" />
      <stop offset="100%" stop-color="#1E673D" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#hospyMark)" />
  <path
    fill="#FFFFFF"
    d="M9 8h4.5v6h5V8H23v16h-4.5v-6h-5v6H9z"
  />
</svg>
