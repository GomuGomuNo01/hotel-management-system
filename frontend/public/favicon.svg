<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="La baie des lacs">
  <!--
    Monogramme « LB » (La Baie) — graisse 800 et crénage resserré pour rester
    lisible à 16 px, où le dégradé se lit comme un aplat vert.
    Doit rester cohérent avec BRAND.monogram (src/config/brand.js).
  -->
  <defs>
    <linearGradient id="lblMark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2F9E5B" />
      <stop offset="100%" stop-color="#1E673D" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#lblMark)" />
  <text
    x="16" y="16"
    text-anchor="middle" dominant-baseline="central"
    font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="15" font-weight="800" letter-spacing="-0.8"
    fill="#FFFFFF"
  >LB</text>
</svg>
